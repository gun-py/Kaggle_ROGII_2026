[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rogii-wellbore"
version = "0.1.0"
description = "TVT prediction for the ROGII wellbore geology Kaggle competition"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "numba>=0.59",
  "joblib>=1.3",
  "lightgbm>=4.3",
  "catboost>=1.2",
]

[project.optional-dependencies]
seq = ["torch>=2.2"]
package = ["xgboost>=2.0"]
viz = ["matplotlib>=3.8", "seaborn>=0.13"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pre-commit>=3.7"]

[project.scripts]
rogii = "rogii.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rogii = ["configs/**/*.toml", "structural/weights/*"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not parity'"
markers = ["parity: compares against the legacy notebooks; needs data/raw and the legacy-notebooks tag"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
